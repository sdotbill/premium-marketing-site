<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing Link Maker — Premium Marketing (Internal)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b1f33; color: #eaf2fa; min-height: 100vh; padding: 20px 16px 60px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand .tree { font-size: 40px; }
  .brand h1 { font-size: 22px; color: #7fd4ff; margin-top: 6px; }
  .brand p { font-size: 13px; color: #9db4c9; margin-top: 4px; }
  .card { background: #12293f; border: 1px solid #1e3a57; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #9db4c9; margin: 12px 0 5px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #2a4a68; background: #0b1f33; color: #fff; }
  input:focus { outline: none; border-color: #7fd4ff; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .btn { display: block; width: 100%; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 10px; background: #22b573; color: #fff; cursor: pointer; margin-top: 16px; }
  .btn:active { transform: scale(.98); }
  .btn2 { background: #1e6fb8; margin-top: 10px; }
  #out { display: none; }
  #linkBox { background: #0b1f33; border: 1px dashed #2a4a68; border-radius: 8px; padding: 12px; font-size: 13px; word-break: break-all; color: #7fd4ff; margin: 12px 0; line-height: 1.5; }
  #smsBox { background: #0b1f33; border: 1px solid #2a4a68; border-radius: 8px; padding: 12px; font-size: 14px; color: #eaf2fa; margin: 12px 0; line-height: 1.5; white-space: pre-wrap; }
  .hint { font-size: 12px; color: #9db4c9; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="tree">🌲</div>
    <h1>Signing Link Maker</h1>
    <p>Premium Marketing — internal tool. Fill in the deal, get the textable signing link.</p>
  </div>
  <div class="card">
    <label>Business name</label>
    <input id="c" placeholder="Maki Tree Service" autocomplete="off">
    <label>Contact name</label>
    <input id="n" placeholder="Pam Maki" autocomplete="off">
    <label>Signing token (auto-made from business + date — edit if you like)</label>
    <input id="t" autocomplete="off">
    <div class="row">
      <div><label>Monthly $</label><input id="m" value="997" inputmode="numeric"></div>
      <div><label>Setup total $</label><input id="s" value="12500" inputmode="numeric"></div>
      <div><label>Due at signing $</label><input id="d" value="6250" inputmode="numeric"></div>
    </div>
    <label>Client email (optional — shown on the agreement)</label>
    <input id="e" placeholder="client@business.com" autocomplete="off">
    <button class="btn" onclick="make()">Make signing link</button>
  </div>
  <div class="card" id="out">
    <label>Signing link — copy &amp; text it</label>
    <div id="linkBox"></div>
    <button class="btn btn2" onclick="copyLink()">Copy link</button>
    <label style="margin-top:16px">Suggested text to send</label>
    <div id="smsBox"></div>
    <button class="btn btn2" onclick="copySms()">Copy text message</button>
    <p class="hint">After they sign, the signature lands in your inbox and the signature watcher pings you. Countersign in Forge, then text the payment link — same as always.</p>
  </div>
</div>
<script>
const BASE = 'https://sdotbill.github.io/premium-marketing-site/sign.html';
function slug(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30) || 'client'; }
function autoToken(){
  const d = new Date();
  const mmdd = String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  document.getElementById('t').value = slug(document.getElementById('c').value) + '-' + mmdd;
}
document.getElementById('c').addEventListener('input', autoToken);
autoToken();
let lastLink = '', lastSms = '';
function make(){
  const v = id => document.getElementById(id).value.trim();
  const p = new URLSearchParams();
  if(v('t')) p.set('t', v('t'));
  if(v('c')) p.set('c', v('c'));
  if(v('n')) p.set('n', v('n'));
  if(v('m')) p.set('m', v('m').replace(/[^0-9]/g,''));
  if(v('s')) p.set('s', v('s').replace(/[^0-9]/g,''));
  if(v('d')) p.set('d', v('d').replace(/[^0-9]/g,''));
  if(v('e')) p.set('e', v('e'));
  lastLink = BASE + '?' + p.toString();
  lastSms = 'Hi ' + (v('n').split(' ')[0] || 'there') + ', here\'s your Premium Marketing service agreement: ' + lastLink + ' — read through and sign right on your phone. Let me know if you have any questions. — Bill (989) 990-1048';
  document.getElementById('linkBox').textContent = lastLink;
  document.getElementById('smsBox').textContent = lastSms;
  document.getElementById('out').style.display = 'block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
function copyText(txt, btn){
  navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=o,1500); });
}
function copyLink(){ copyText(lastLink, event.target); }
function copySms(){ copyText(lastSms, event.target); }
</script>
</body>
</html>
