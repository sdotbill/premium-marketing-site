<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dave — Everyone Needs a Dave</title>
<meta name="description" content="Everyone needs a Dave — the first exolex. Talk to Dave: he answers the moment you talk to him. Sealed: what you tell Dave is never shared, never sold, never leaving.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ee; --paper2:#f4ecdb; --card:#fffdf8;
    --ink:#2e2118; --muted:#6f5f4c; --line:#e6d9c2;
    --amber:#b06f0a; --amber-dark:#8f5a06; --gold:#a97e14;
    --blue:#5b8bc0; --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:17.5px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--amber-dark);}

  /* ---- one viewport, no scroll: headline / talk bar / seal ---- */
  .stage{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

  /* ---- living Dave, top corner: small, matted on the page, speech bubble ---- */
  .dave-corner{
    position:absolute;top:20px;right:22px;z-index:2;
    display:flex;align-items:flex-start;gap:10px;
  }
  .bubble{
    position:relative;background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:10px 14px;max-width:238px;text-align:left;
    font-size:.92rem;line-height:1.45;color:var(--ink);
    box-shadow:0 6px 18px rgba(46,33,24,.08);
  }
  .bubble::after{
    content:"";position:absolute;right:-8px;top:32px;width:14px;height:14px;
    background:#fff;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);
    transform:rotate(45deg);
  }
  .dave-fig{width:112px;height:auto;display:block;}
  @media (max-width:860px){
    .dave-corner{top:12px;right:12px;}
    .dave-fig{width:84px;}
    .bubble{max-width:172px;font-size:.84rem;padding:8px 11px;}
    .bubble::after{top:24px;}
  }
  .center{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 20px 12px;width:100%;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:700;
    font-size:clamp(2.6rem,6.5vw,4.3rem);line-height:1.06;letter-spacing:-.01em;
    color:#1b5db5;
    background:linear-gradient(93deg,#14529e 0%,#1e6bc4 48%,#5b8bc0 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .center .chatbox{margin:36px auto 0;width:100%;}
  .seal{
    text-align:center;color:var(--muted);font-size:.97rem;line-height:1.5;
    padding:14px 20px 12px;
  }
  .seal strong{color:var(--ink);}
  .legal{
    border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:10px 22px;font-size:.8rem;color:var(--muted);
  }
  .legal a{color:var(--muted);text-decoration:none;}
  .legal a:hover{text-decoration:underline;}

/* ---- live chat box (talk to Dave, right here) ---- */
  .chatbox{
    max-width:36rem;margin:30px auto 0;text-align:left;
    background:#fff;border:1.5px solid var(--line);border-radius:28px;
    padding:16px;box-shadow:0 10px 30px rgba(46,33,24,.10);
  }
  .chat-thread{display:flex;flex-direction:column;gap:10px;max-height:330px;overflow-y:auto;padding:4px 2px 10px;}
  .msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:1.02rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .msg-dave{align-self:flex-start;background:var(--paper2);border:1px solid var(--line);border-bottom-left-radius:6px;}
  .msg-user{align-self:flex-end;background:var(--amber);color:#fff;border-bottom-right-radius:6px;}
  .msg-error{background:#f7e8e0 !important;border-color:#e0b9a6 !important;}
  .chat-turns{margin:2px 2px 8px;color:var(--gold);font-size:.85rem;font-weight:600;}
  .chat-row{display:flex;align-items:center;gap:10px;}
  .chat-mic{
    flex:none;width:46px;height:46px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);font-size:1.2rem;cursor:pointer;line-height:1;padding:0;
  }
  .chat-mic.listening{background:#f3d9a4;border-color:var(--gold);}
  .chat-input{
    flex:1;font:inherit;font-size:1.05rem;color:var(--ink);min-width:0;
    border:1.5px solid var(--line);border-radius:999px;padding:11px 18px;background:#fff;
  }
  .chat-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,126,20,.18);}
  .chat-send{
    flex:none;background:var(--amber);color:#fff;font-weight:600;border:none;cursor:pointer;
    padding:12px 24px;border-radius:999px;font-size:1rem;font-family:inherit;
  }
  .chat-send:hover{background:var(--amber-dark);}
  .chat-send[disabled]{opacity:.55;cursor:wait;}
  .chat-tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .chat-tool{
    background:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;
    font:inherit;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;
  }
  .chat-forgot{margin:10px 2px 0;color:#4c7a24;font-weight:600;font-size:.95rem;}
  .msg-typing .dots i{
    display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;
    background:var(--muted);animation:tblink 1.1s infinite;
  }
  .msg-typing .dots i:nth-child(2){animation-delay:.18s;}
  .msg-typing .dots i:nth-child(3){animation-delay:.36s;margin-right:0;}
  @keyframes tblink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
</style>
</head>

  <div class="center">
    <h1>Everyone needs a Dave.</h1>
<div class="chatbox" id="chat">
  <div class="chat-thread" id="chat-thread" aria-live="polite"></div>
  <p class="chat-turns" id="chat-turns" hidden></p>
  <div class="chat-row">
    <button class="chat-mic" id="chat-mic" type="button" aria-label="Speak to Dave" aria-pressed="false" title="Speak to Dave">🎤</button>
    <input class="chat-input" id="chat-input" type="text" placeholder="Talk to Dave…" aria-label="Message Dave" autocomplete="off">
    <button class="chat-send" id="chat-send" type="button">Talk</button>
  </div>
  <div class="chat-tools">
    <button class="chat-tool" id="chat-speak-toggle" type="button" aria-pressed="true">🔊 Dave's voice: on</button>
    <button class="chat-tool" id="chat-forget" type="button">Forget me</button>
  </div>
  <p class="chat-forgot" id="chat-forgot" hidden>Forgotten. Nothing left this browser anyway — that's the seal.</p>
</div>
  </div>
  <p class="seal"><strong>Sealed</strong> — what you tell Dave is never shared, never sold, never leaving.</p>
  <footer class="legal">
    <span>Premium Marketing Solutions LLC</span>
    <a href="privacy.html">Privacy</a>
  </footer>
</main>
<script>
/* Website Dave — live chat. The conversation lives in this browser only:
   session + history in localStorage, nothing stored on any server. */
(function(){
  "use strict";
  const DAVE_CHAT_ENDPOINT = "WORKER_URL_PLACEHOLDER";
  var SESSION_KEY = "dave_chat_session";
  var HISTORY_KEY = "dave_chat_history";
  var thread = document.getElementById("chat-thread");
  var input = document.getElementById("chat-input");
  var sendBtn = document.getElementById("chat-send");
  var micBtn = document.getElementById("chat-mic");
  var speakBtn = document.getElementById("chat-speak-toggle");
  var forgetBtn = document.getElementById("chat-forget");
  var turnsEl = document.getElementById("chat-turns");
  var forgotEl = document.getElementById("chat-forgot");
  if(!thread || !input || !sendBtn) return;

  var speakOn = false;
  var sending = false;
  var sessionId = null;
  var history = [];

  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 12);
  }
  function storeSession(){
    try{ localStorage.setItem(SESSION_KEY, sessionId); }catch(e){}
  }
  function load(){
    try{ sessionId = localStorage.getItem(SESSION_KEY); }catch(e){}
    if(!sessionId){ sessionId = uuid(); storeSession(); }
    try{ history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }catch(e){ history = []; }
    if(!Array.isArray(history)) history = [];
  }
  function save(){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }catch(e){}
  }
  function bubble(role, text){
    var row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "msg-user" : "msg-dave");
    var span = document.createElement("span");
    span.textContent = text;
    row.appendChild(span);
    if(role !== "user" && "speechSynthesis" in window){
      var lb = document.createElement("button");
      lb.type = "button";
      lb.className = "msg-listen";
      lb.textContent = "\u25B6 Listen";
      lb.setAttribute("aria-label", "Listen to Dave's reply");
      lb.setAttribute("aria-pressed", "false");
      lb.style.cssText = "display:block;margin-top:8px;background:rgba(255,255,255,.55);border:1.5px solid rgba(111,95,76,.35);border-radius:999px;padding:3px 12px;font:inherit;font-size:.82rem;font-weight:600;color:#8f5a06;cursor:pointer;";
      lb.addEventListener("click", function(){ speakReply(text, lb); });
      row.appendChild(lb);
    }
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return row;
  }
  function greet(){
    bubble("assistant", "Hi, I'm Dave. Talk to me — type below, or tap the mic and just speak. I answer out loud.");
  }
  function renderAll(){
    thread.innerHTML = "";
    if(!history.length){ greet(); return; }
    for(var i = 0; i < history.length; i++) bubble(history[i].role, history[i].content);
  }
  function pickVoice(){
    if(!("speechSynthesis" in window)) return null;
    var vs = speechSynthesis.getVoices() || [];
    function pick(list, sub){
      for(var i = 0; i < list.length; i++){
        if(list[i].name.toLowerCase().indexOf(sub) !== -1) return list[i];
      }
      return null;
    }
    var us = [], en = [], i, v;
    for(i = 0; i < vs.length; i++){
      v = vs[i];
      if(/^en[-_]US/i.test(v.lang)) us.push(v);
      else if(/^en/i.test(v.lang)) en.push(v);
    }
    return pick(us, "google us english") || pick(us, "natural") || pick(us, "microsoft") ||
           (us.length ? us[0] : null) || pick(en, "google") || (en.length ? en[0] : null) ||
           (vs.length ? vs[0] : null);
  }
  if("speechSynthesis" in window){
    try{ speechSynthesis.getVoices(); }catch(e){}
    if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", pickVoice);
  }
  function speak(text){
    if(!speakOn || !("speechSynthesis" in window)) return;
    try{
      stopSpeaking();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v) u.voice = v;
      u.lang = "en-US";
      speechSynthesis.speak(u);
    }catch(e){}
  }
  var activeListenBtn = null;
  function resetListenBtn(){
    if(!activeListenBtn) return;
    activeListenBtn.textContent = "\u25B6 Listen";
    activeListenBtn.style.background = "rgba(255,255,255,.55)";
    activeListenBtn.setAttribute("aria-pressed", "false");
    activeListenBtn = null;
  }
  function stopSpeaking(){
    if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); }catch(e){} }
    resetListenBtn();
  }
  function speakReply(text, btn){
    if(!("speechSynthesis" in window)) return;
    if(activeListenBtn === btn){ stopSpeaking(); return; }
    stopSpeaking();
    try{
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v) u.voice = v;
      u.lang = "en-US";
      activeListenBtn = btn;
      btn.textContent = "\u23F9 Stop";
      btn.style.background = "#f3d9a4";
      btn.setAttribute("aria-pressed", "true");
      var done = function(){ if(activeListenBtn === btn) resetListenBtn(); };
      u.onend = done;
      u.onerror = done;
      speechSynthesis.speak(u);
    }catch(e){ resetListenBtn(); }
  }
  function showTurns(n){
    if(!turnsEl) return;
    if(typeof n === "number" && n <= 5){
      turnsEl.textContent = n + (n === 1 ? " exchange" : " exchanges") + " left in this free conversation";
      turnsEl.hidden = false;
    }
  }
  function setSending(on){
    sending = on;
    sendBtn.disabled = on;
    input.disabled = on;
  }
  function send(){
    var text = input.value.trim();
    if(!text || sending) return;
    if(!sessionId){ sessionId = uuid(); storeSession(); }
    if(forgotEl) forgotEl.hidden = true;
    history.push({role: "user", content: text});
    save();
    bubble("user", text);
    input.value = "";
    setSending(true);
    var typing = bubble("assistant", "");
    typing.classList.add("msg-typing");
    typing.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    fetch(DAVE_CHAT_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session: sessionId, messages: history})
    }).then(function(r){
      return r.json().then(function(data){ return data; }, function(){ return {}; });
    }).then(function(data){
      typing.remove();
      setSending(false);
      if(data && data.reply){
        history.push({role: "assistant", content: data.reply});
        save();
        bubble("assistant", data.reply);
        speak(data.reply);
        showTurns(data.turns_left);
      }else{
        bubble("assistant", "That didn't get through to me — try me again in a moment.").classList.add("msg-error");
      }
      input.focus();
    }).catch(function(){
      typing.remove();
      setSending(false);
      bubble("assistant", "I can't be reached from here right now. Try again in a moment — or leave Dave a note and a real Dave answers you personally.").classList.add("msg-error");
      input.focus();
    });
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); send(); }
  });

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    if(micBtn) micBtn.hidden = true;
  }else if(micBtn){
    var rec = null, listening = false;
    function micOff(){
      listening = false;
      micBtn.classList.remove("listening");
      micBtn.setAttribute("aria-pressed", "false");
    }
    micBtn.addEventListener("click", function(){
      if(listening && rec){ try{ rec.stop(); }catch(e){} return; }
      rec = new SR();
      rec.lang = "en-US";
      rec.continuous = false;
      rec.interimResults = true;
      var base = input.value.replace(/\s+$/, "");
      rec.onresult = function(ev){
        var txt = "";
        for(var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        input.value = base ? base + " " + txt : txt;
      };
      rec.onend = micOff;
      rec.onerror = micOff;
      listening = true;
      micBtn.classList.add("listening");
      micBtn.setAttribute("aria-pressed", "true");
      try{ rec.start(); }catch(e){ micOff(); }
    });
  }

  if(speakBtn){
    speakBtn.setAttribute("aria-pressed", "false");
    speakBtn.textContent = "\uD83D\uDD07 Dave's voice: off";
    speakBtn.addEventListener("click", function(){
      speakOn = !speakOn;
      speakBtn.setAttribute("aria-pressed", speakOn ? "true" : "false");
      speakBtn.textContent = speakOn ? "🔊 Dave's voice: on" : "🔇 Dave's voice: off";
      if(!speakOn) stopSpeaking();
    });
  }
  if(forgetBtn){
    forgetBtn.addEventListener("click", function(){
      try{
        localStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(HISTORY_KEY);
      }catch(e){}
      history = [];
      sessionId = null;
      thread.innerHTML = "";
      greet();
      stopSpeaking();
      if(turnsEl) turnsEl.hidden = true;
      if(forgotEl) forgotEl.hidden = false;
    });
  }

  load();
  renderAll();
})();
</script>
</body>
